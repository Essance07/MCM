<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MCM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:-apple-system,sans-serif;font-size:18px;width:100vw;height:100vh;overflow:hidden}

/* Round screen safe square (inscribed in circle = 70.7% of diameter) */
.round-safe{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:70.7vw;
  height:70.7vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
@media (min-width:350px) and (orientation:portrait){
  .round-safe{width:96vw;height:96vh}
}
@media (min-width:600px){
  .round-safe{width:400px;height:600px}
}

.tabs{display:flex;gap:3px;margin-bottom:6px;flex-shrink:0}
.tab{flex:1;padding:8px 0;text-align:center;background:#222;border-radius:5px;font-size:15px;font-weight:700;cursor:pointer;border:1px solid #333;min-width:0;overflow:hidden}
.tab.active{background:#1e88e5;color:#fff;border-color:#1e88e5}

.page-wrap{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.page{display:none;padding:2px}
.page.active{display:block}

h2{font-size:14px;margin:6px 0 3px;color:#4fc3f7;font-weight:700;text-align:center}
.bigin{width:100%;background:#1a1a1a;border:2px solid #333;color:#fff;padding:10px;border-radius:6px;font-size:18px;font-family:monospace;-webkit-appearance:none;text-align:center;letter-spacing:1px;font-weight:700}
.bigin:focus{outline:none;border-color:#1e88e5;background:#222}
.hint{font-size:12px;color:#888;margin:4px 0;line-height:1.3;text-align:center}
.status{font-size:13px;text-align:center;padding:4px;border-radius:4px;margin:4px 0;font-weight:700}
.status.ok{background:#0a2818;color:#81c784}
.status.err{background:#2a0a0a;color:#ef9a9a}

.btn{display:block;width:100%;padding:9px;background:#1e88e5;color:#fff;border:none;border-radius:5px;font-size:15px;font-weight:700;cursor:pointer;margin-top:5px}
.btn.sec{background:#333;font-size:13px;padding:7px}
.btn:active{background:#1565c0}
.btnrow{display:flex;gap:3px;margin-top:4px}
.btnrow .btn{flex:1;margin-top:0}

.ans-banner{background:#0a2818;border:2px solid #2e7d32;border-radius:6px;padding:8px;margin:6px 0;text-align:center;font-family:monospace}
.ans-banner .big{font-size:20px;color:#81c784;font-weight:700;line-height:1.2}
.ans-banner .small{font-size:12px;color:#aaa;margin-top:4px;word-break:break-all;line-height:1.3}

.result-block{background:#0d1721;border:1px solid #1e3a5f;border-radius:5px;padding:5px;margin-bottom:5px}
.cell-hdr{font-size:16px;font-weight:700;color:#4fc3f7;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid #1e3a5f;text-align:center}
.k-line{font-family:monospace;font-size:13px;line-height:1.4;color:#ccc;padding:2px 3px}
.k-line.win{color:#81c784;font-weight:700;background:#0a2818;border-radius:3px}
.k-line .n{color:#fff;font-size:14px}
.k-line .calc{color:#888;font-size:11px;display:block;padding-left:10px;line-height:1.3}
.cell-result{font-size:13px;color:#ffeb3b;margin-top:4px;padding-top:3px;border-top:1px dashed #333;font-family:monospace;text-align:center;font-weight:700}

.grid-view{overflow-x:auto;width:100%}
.grid-view table{width:100%;border-collapse:collapse;font-size:12px;font-family:monospace}
.grid-view th,.grid-view td{border:1px solid #333;padding:4px 2px;text-align:right;color:#fff;min-width:28px}
.grid-view th{background:#1e3a5f;color:#4fc3f7;font-size:12px;font-weight:700}
.grid-view td.diag{background:#0d1721;color:#666}
.grid-view td.ans{background:#0a2818;color:#81c784;font-weight:700}

.len-filter{display:flex;gap:2px;margin-bottom:5px;flex-wrap:wrap}
.len-btn{flex:1;min-width:32px;padding:6px 0;background:#222;color:#aaa;border:1px solid #333;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;text-align:center}
.len-btn.active{background:#1e88e5;color:#fff;border-color:#1e88e5}

::-webkit-scrollbar{width:0;height:0;display:none}

.empty{color:#888;text-align:center;padding:20px;font-size:13px}
</style>
</head>
<body>

<div class="round-safe">
  <div class="tabs">
    <div class="tab active" data-page="in">in</div>
    <div class="tab" data-page="cells">k</div>
    <div class="tab" data-page="grid">m</div>
    <div class="tab" data-page="s">s</div>
  </div>

  <div class="page-wrap">
    <div class="page active" id="in">
      <input type="text" inputmode="decimal" id="dims" class="bigin" placeholder="20 25 5 20" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div id="status" class="hint">space-separated</div>
      <div id="answer"></div>
      <div class="btnrow">
        <button class="btn sec" id="ex6">n=6</button>
        <button class="btn sec" id="ex4">n=4</button>
        <button class="btn sec" id="clr">clr</button>
      </div>
    </div>

    <div class="page" id="cells">
      <div class="len-filter" id="lenFilter"></div>
      <div id="cellsOut"><div class="empty">enter dims →</div></div>
    </div>

    <div class="page" id="grid">
      <h2>m[i,j]</h2>
      <div class="grid-view" id="mGrid"><div class="empty">enter dims →</div></div>
    </div>

    <div class="page" id="s">
      <h2>s[i,j]</h2>
      <div class="grid-view" id="sGrid"><div class="empty">enter dims →</div></div>
    </div>
  </div>
</div>

<script>
let M=null, S=null, ALL=null, P=null, currentL=2, N=0;

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.page).classList.add('active');
    document.querySelector('.page-wrap').scrollTop=0;
  });
});

function parseInput(s){
  if(!s||!s.trim())return null;
  const parts=s.trim().split(/[\s,]+/).filter(x=>x.length>0);
  const arr=[];
  for(const x of parts){
    const v=parseFloat(x);
    if(isNaN(v))return {error:'bad: '+x};
    arr.push(v);
  }
  if(arr.length<3)return {error:'need ≥3 ('+arr.length+')'};
  return {p:arr};
}

function solve(p){
  const n=p.length-1;
  const m=Array.from({length:n+1},()=>new Array(n+1).fill(0));
  const s=Array.from({length:n+1},()=>new Array(n+1).fill(0));
  const all={};
  for(let L=2;L<=n;L++){
    for(let i=1;i<=n-L+1;i++){
      const j=i+L-1;
      m[i][j]=Infinity;
      const cands=[];
      for(let k=i;k<j;k++){
        const prod=p[i-1]*p[k]*p[j];
        const val=m[i][k]+m[k+1][j]+prod;
        cands.push({k,val,leftM:m[i][k],rightM:m[k+1][j],prod,
          pi1:p[i-1],pk:p[k],pj:p[j]});
        if(val<m[i][j]){m[i][j]=val; s[i][j]=k;}
      }
      all[L+'_'+i+'_'+j]=cands;
    }
  }
  return {m,s,all,n};
}

function parens(s,i,j){
  if(i===j) return 'A'+i;
  return '('+parens(s,i,s[i][j])+parens(s,s[i][j]+1,j)+')';
}

function update(){
  const txt=document.getElementById('dims').value;
  const r=parseInput(txt);
  const st=document.getElementById('status');
  const ans=document.getElementById('answer');
  if(!r){
    st.className='hint';
    st.textContent='space-separated';
    ans.innerHTML='';
    M=null;S=null;ALL=null;
    document.getElementById('cellsOut').innerHTML='<div class="empty">enter dims →</div>';
    document.getElementById('mGrid').innerHTML='<div class="empty">enter dims →</div>';
    document.getElementById('sGrid').innerHTML='<div class="empty">enter dims →</div>';
    return;
  }
  if(r.error){
    st.className='status err';
    st.textContent=r.error;
    ans.innerHTML='';
    return;
  }
  P=r.p;
  N=P.length-1;
  st.className='status ok';
  st.textContent='✓ '+N+' mat';
  const result=solve(P);
  M=result.m; S=result.s; ALL=result.all;
  ans.innerHTML='<div class="ans-banner">'
    +'<div class="big">m[1,'+N+']='+M[1][N]+'</div>'
    +'<div class="small">s='+S[1][N]+' · '+parens(S,1,N)+'</div>'
    +'</div>';
  if(currentL>N) currentL=2;
  renderCells();
  renderGrid();
  renderS();
}

const dimsEl=document.getElementById('dims');
dimsEl.addEventListener('input',update);
dimsEl.addEventListener('change',update);

document.getElementById('ex6').onclick=function(){dimsEl.value='20 25 25 5 20 30 35';update();};
document.getElementById('ex4').onclick=function(){dimsEl.value='5 4 6 2 7';update();};
document.getElementById('clr').onclick=function(){dimsEl.value='';update();dimsEl.focus();};

function renderCells(){
  if(!M)return;
  const lf=document.getElementById('lenFilter');
  lf.innerHTML='';
  for(let L=2;L<=N;L++){
    const b=document.createElement('div');
    b.className='len-btn'+(L===currentL?' active':'');
    b.textContent='L'+L;
    b.onclick=function(){currentL=L;renderCells();document.querySelector('.page-wrap').scrollTop=0;};
    lf.appendChild(b);
  }
  const out=document.getElementById('cellsOut');
  out.innerHTML='';
  for(let i=1;i<=N-currentL+1;i++){
    const j=i+currentL-1;
    const cands=ALL[currentL+'_'+i+'_'+j];
    const winK=S[i][j];
    const div=document.createElement('div');
    div.className='result-block';
    let html='<div class="cell-hdr">m['+i+','+j+']</div>';
    cands.forEach(function(c){
      const isWin=c.k===winK;
      const calc=(c.leftM||c.rightM)
        ? c.leftM+'+'+c.rightM+'+'+c.pi1+'·'+c.pk+'·'+c.pj
        : c.pi1+'·'+c.pk+'·'+c.pj;
      html+='<div class="k-line'+(isWin?' win':'')+'">k='+c.k+': <span class="n">'+c.val+'</span><span class="calc">'+calc+'</span></div>';
    });
    html+='<div class="cell-result">→ '+M[i][j]+' (s='+winK+')</div>';
    div.innerHTML=html;
    out.appendChild(div);
  }
}

function renderGrid(){
  if(!M)return;
  let html='<table><tr><th>i\\j</th>';
  for(let j=1;j<=N;j++) html+='<th>'+j+'</th>';
  html+='</tr>';
  for(let i=1;i<=N;i++){
    html+='<tr><th>'+i+'</th>';
    for(let j=1;j<=N;j++){
      if(j<i) html+='<td class="diag">·</td>';
      else if(j===i) html+='<td class="diag">0</td>';
      else if(i===1&&j===N) html+='<td class="ans">'+M[i][j]+'</td>';
      else html+='<td>'+M[i][j]+'</td>';
    }
    html+='</tr>';
  }
  html+='</table>';
  document.getElementById('mGrid').innerHTML=html;
}

function renderS(){
  if(!S)return;
  let html='<table><tr><th>i\\j</th>';
  for(let j=1;j<=N;j++) html+='<th>'+j+'</th>';
  html+='</tr>';
  for(let i=1;i<=N;i++){
    html+='<tr><th>'+i+'</th>';
    for(let j=1;j<=N;j++){
      if(j<=i) html+='<td class="diag">·</td>';
      else if(i===1&&j===N) html+='<td class="ans">'+S[i][j]+'</td>';
      else html+='<td>'+S[i][j]+'</td>';
    }
    html+='</tr>';
  }
  html+='</table>';
  document.getElementById('sGrid').innerHTML=html;
}
</script>
</body>
</html>
