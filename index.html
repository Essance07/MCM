<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MCM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000;color:#fff;font-family:-apple-system,sans-serif;font-size:14px;width:100%;min-height:100vh;overflow-x:hidden}
body{padding:6px;padding-top:env(safe-area-inset-top,6px);padding-bottom:env(safe-area-inset-bottom,6px)}

.tabs{display:flex;gap:2px;margin-bottom:4px;position:sticky;top:0;background:#000;z-index:10;padding-bottom:2px}
.tab{flex:1;padding:5px 0;text-align:center;background:#222;border-radius:4px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid #333}
.tab.active{background:#1e88e5;color:#fff;border-color:#1e88e5}

.page{display:none}
.page.active{display:block}

h2{font-size:11px;margin:6px 0 3px;color:#4fc3f7;font-weight:700}
.bigin{width:100%;background:#1a1a1a;border:1px solid #333;color:#fff;padding:8px;border-radius:4px;font-size:15px;font-family:monospace;-webkit-appearance:none;text-align:center;letter-spacing:1px}
.bigin:focus{outline:none;border-color:#1e88e5;background:#222}
.hint{font-size:9px;color:#888;margin:3px 0;line-height:1.3;text-align:center}
.status{font-size:10px;text-align:center;padding:3px;border-radius:3px;margin:3px 0}
.status.ok{background:#0a2818;color:#81c784}
.status.err{background:#2a0a0a;color:#ef9a9a}

.btn{display:block;width:100%;padding:8px;background:#1e88e5;color:#fff;border:none;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;margin-top:4px}
.btn.sec{background:#333;font-size:10px;padding:5px}
.btn:active{background:#1565c0}
.btnrow{display:flex;gap:3px;margin-top:3px}
.btnrow .btn{flex:1;margin-top:0}

.ans-banner{background:#0a2818;border:1px solid #2e7d32;border-radius:4px;padding:5px;margin-bottom:5px;text-align:center;font-family:monospace}
.ans-banner .big{font-size:14px;color:#81c784;font-weight:700}
.ans-banner .small{font-size:9px;color:#aaa;margin-top:2px;word-break:break-all}

.result-block{background:#0d1721;border:1px solid #1e3a5f;border-radius:3px;padding:4px;margin-bottom:4px}
.cell-hdr{font-size:12px;font-weight:700;color:#4fc3f7;margin-bottom:2px;padding-bottom:1px;border-bottom:1px solid #1e3a5f}
.k-line{font-family:monospace;font-size:10px;line-height:1.35;color:#ccc;padding:1px 2px}
.k-line.win{color:#81c784;font-weight:700;background:#0a2818;border-radius:2px}
.k-line .n{color:#fff}
.k-line .calc{color:#888;font-size:9px;display:block;padding-left:8px}
.cell-result{font-size:10px;color:#ffeb3b;margin-top:2px;padding-top:2px;border-top:1px dashed #333;font-family:monospace}

.grid-view{overflow-x:auto}
.grid-view table{width:100%;border-collapse:collapse;font-size:9px;font-family:monospace}
.grid-view th,.grid-view td{border:1px solid #333;padding:2px 1px;text-align:right;color:#fff;min-width:24px}
.grid-view th{background:#1e3a5f;color:#4fc3f7;font-size:9px}
.grid-view td.diag{background:#0d1721;color:#666}
.grid-view td.ans{background:#0a2818;color:#81c784;font-weight:700}

.len-filter{display:flex;gap:2px;margin-bottom:4px;flex-wrap:wrap}
.len-btn{flex:1;min-width:26px;padding:3px 0;background:#222;color:#888;border:1px solid #333;border-radius:3px;font-size:10px;font-weight:700;cursor:pointer;text-align:center}
.len-btn.active{background:#1e88e5;color:#fff;border-color:#1e88e5}

::-webkit-scrollbar{display:none}

@media (max-width:200px){
  body{padding:3px;font-size:10px}
  .tab{font-size:9px;padding:4px 0}
  .bigin{font-size:13px;padding:6px}
  h2{font-size:10px}
  .k-line{font-size:9px}
  .cell-hdr{font-size:10px}
  .ans-banner .big{font-size:12px}
}

.empty{color:#666;text-align:center;padding:20px;font-size:10px}
</style>
</head>
<body>

<div class="tabs">
  <div class="tab active" data-page="in">in</div>
  <div class="tab" data-page="cells">cells</div>
  <div class="tab" data-page="grid">m[]</div>
  <div class="tab" data-page="s">s[]</div>
</div>

<div class="page active" id="in">
  <h2>Dimensions p₀ p₁ p₂ ... (space-sep)</h2>
  <input type="text" inputmode="decimal" id="dims" class="bigin" placeholder="20 25 25 5 20 30 35" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="status" class="hint">Enter ≥3 numbers (n = count − 1 matrices)</div>
  <div id="answer"></div>
  <div class="btnrow">
    <button class="btn sec" id="ex6">Ex n=6</button>
    <button class="btn sec" id="ex4">Ex n=4</button>
    <button class="btn sec" id="clr">Clr</button>
  </div>
</div>

<div class="page" id="cells">
  <div class="len-filter" id="lenFilter"></div>
  <div id="cellsOut"><div class="empty">Enter dims first →</div></div>
</div>

<div class="page" id="grid">
  <h2>m[i,j]</h2>
  <div class="grid-view" id="mGrid"><div class="empty">Enter dims first →</div></div>
</div>

<div class="page" id="s">
  <h2>s[i,j]</h2>
  <div class="grid-view" id="sGrid"><div class="empty">Enter dims first →</div></div>
</div>

<script>
let M=null, S=null, ALL=null, P=null, currentL=2, N=0;

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.page).classList.add('active');
    window.scrollTo(0,0);
  });
});

function parseInput(s){
  if(!s||!s.trim())return null;
  const parts=s.trim().split(/[\s,]+/).filter(x=>x.length>0);
  const arr=[];
  for(const x of parts){
    const v=parseFloat(x);
    if(isNaN(v))return {error:'Bad number: '+x};
    arr.push(v);
  }
  if(arr.length<3)return {error:'Need ≥3 dims (got '+arr.length+')'};
  return {p:arr};
}

function solve(p){
  const n=p.length-1;
  const m=Array.from({length:n+1},()=>new Array(n+1).fill(0));
  const s=Array.from({length:n+1},()=>new Array(n+1).fill(0));
  const all={};
  for(let L=2;L<=n;L++){
    for(let i=1;i<=n-L+1;i++){
      const j=i+L-1;
      m[i][j]=Infinity;
      const cands=[];
      for(let k=i;k<j;k++){
        const prod=p[i-1]*p[k]*p[j];
        const val=m[i][k]+m[k+1][j]+prod;
        cands.push({k,val,leftM:m[i][k],rightM:m[k+1][j],prod,
          pi1:p[i-1],pk:p[k],pj:p[j]});
        if(val<m[i][j]){m[i][j]=val; s[i][j]=k;}
      }
      all[L+'_'+i+'_'+j]=cands;
    }
  }
  return {m,s,all,n};
}

function parens(s,i,j){
  if(i===j) return 'A'+i;
  return '('+parens(s,i,s[i][j])+parens(s,s[i][j]+1,j)+')';
}

function update(){
  const txt=document.getElementById('dims').value;
  const r=parseInput(txt);
  const st=document.getElementById('status');
  const ans=document.getElementById('answer');
  if(!r){
    st.className='hint';
    st.textContent='Enter ≥3 numbers (n = count − 1 matrices)';
    ans.innerHTML='';
    M=null;S=null;ALL=null;
    document.getElementById('cellsOut').innerHTML='<div class="empty">Enter dims first →</div>';
    document.getElementById('mGrid').innerHTML='<div class="empty">Enter dims first →</div>';
    document.getElementById('sGrid').innerHTML='<div class="empty">Enter dims first →</div>';
    return;
  }
  if(r.error){
    st.className='status err';
    st.textContent=r.error;
    ans.innerHTML='';
    return;
  }
  P=r.p;
  N=P.length-1;
  st.className='status ok';
  st.textContent='✓ '+N+' matrices, '+P.length+' dims';
  const result=solve(P);
  M=result.m; S=result.s; ALL=result.all;
  ans.innerHTML='<div class="ans-banner">'
    +'<div class="big">m[1,'+N+'] = '+M[1][N]+'</div>'
    +'<div class="small">s[1,'+N+']='+S[1][N]+' · '+parens(S,1,N)+'</div>'
    +'</div>';
  if(currentL>N) currentL=2;
  renderCells();
  renderGrid();
  renderS();
}

const dimsEl=document.getElementById('dims');
dimsEl.addEventListener('input',update);
dimsEl.addEventListener('change',update);

document.getElementById('ex6').onclick=function(){dimsEl.value='20 25 25 5 20 30 35';update();};
document.getElementById('ex4').onclick=function(){dimsEl.value='5 4 6 2 7';update();};
document.getElementById('clr').onclick=function(){dimsEl.value='';update();dimsEl.focus();};

function renderCells(){
  if(!M)return;
  const lf=document.getElementById('lenFilter');
  lf.innerHTML='';
  for(let L=2;L<=N;L++){
    const b=document.createElement('div');
    b.className='len-btn'+(L===currentL?' active':'');
    b.textContent='L='+L;
    b.onclick=function(){currentL=L;renderCells();window.scrollTo(0,0);};
    lf.appendChild(b);
  }
  const out=document.getElementById('cellsOut');
  out.innerHTML='';
  for(let i=1;i<=N-currentL+1;i++){
    const j=i+currentL-1;
    const cands=ALL[currentL+'_'+i+'_'+j];
    const winK=S[i][j];
    const div=document.createElement('div');
    div.className='result-block';
    let html='<div class="cell-hdr">m['+i+','+j+']</div>';
    cands.forEach(function(c){
      const isWin=c.k===winK;
      const calc=(c.leftM||c.rightM)
        ? c.leftM+'+'+c.rightM+'+'+c.pi1+'·'+c.pk+'·'+c.pj
        : c.pi1+'·'+c.pk+'·'+c.pj;
      html+='<div class="k-line'+(isWin?' win':'')+'">k='+c.k+': <span class="n">'+c.val+'</span><span class="calc">'+calc+'</span></div>';
    });
    html+='<div class="cell-result">→ m['+i+','+j+']='+M[i][j]+', s='+winK+'</div>';
    div.innerHTML=html;
    out.appendChild(div);
  }
}

function renderGrid(){
  if(!M)return;
  let html='<table><tr><th>i\\j</th>';
  for(let j=1;j<=N;j++) html+='<th>'+j+'</th>';
  html+='</tr>';
  for(let i=1;i<=N;i++){
    html+='<tr><th>'+i+'</th>';
    for(let j=1;j<=N;j++){
      if(j<i) html+='<td class="diag">·</td>';
      else if(j===i) html+='<td class="diag">0</td>';
      else if(i===1&&j===N) html+='<td class="ans">'+M[i][j]+'</td>';
      else html+='<td>'+M[i][j]+'</td>';
    }
    html+='</tr>';
  }
  html+='</table>';
  document.getElementById('mGrid').innerHTML=html;
}

function renderS(){
  if(!S)return;
  let html='<table><tr><th>i\\j</th>';
  for(let j=1;j<=N;j++) html+='<th>'+j+'</th>';
  html+='</tr>';
  for(let i=1;i<=N;i++){
    html+='<tr><th>'+i+'</th>';
    for(let j=1;j<=N;j++){
      if(j<=i) html+='<td class="diag">·</td>';
      else if(i===1&&j===N) html+='<td class="ans">'+S[i][j]+'</td>';
      else html+='<td>'+S[i][j]+'</td>';
    }
    html+='</tr>';
  }
  html+='</table>';
  document.getElementById('sGrid').innerHTML=html;
}
</script>
</body>
</html>
